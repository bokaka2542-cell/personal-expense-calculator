<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}บัญชีรายรับรายจ่าย{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="{{ url_for('main.index') }}" class="brand">💰 บัญชีส่วนตัว</a>
    <div class="nav-links">
      <a href="{{ url_for('main.index') }}">หน้าหลัก</a>
      <a href="{{ url_for('main.entries') }}">รายการทั้งหมด</a>
      <a href="{{ url_for('main.new_entry') }}" class="btn-nav">+ เพิ่มรายการ</a>
      <a href="{{ url_for('main.summary') }}">สรุปยอด</a>
    </div>
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
