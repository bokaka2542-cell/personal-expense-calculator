services:
  - type: web
    name: personal-expense-calculator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: personal-expense-db
          property: connectionString

databases:
  - name: personal-expense-db
    plan: free
